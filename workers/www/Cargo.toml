[package]
name = "premium-discount-worker-www"
description = "premium-discount www (fetch): 앱 로그인(/session) · 평가 · 지갑 타임트라이얼 · 웹 행동 분석 · 그래프 API 와 레거시 처리기. 원본 workers/www/src/*.ts(35781c0)를 workers-rs 로"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
premium-discount-worker-common.workspace = true
# hashMessage · 주소 (ethers 와 같은 값). 지갑 서명 확인(auth.rs)이 쓴다
premium-discount-identity.workspace = true
# RECIPE (판정 행이 없는 평가에 붙이는 규칙 이름, evaluations.rs) — 원본은 cron/src/verdict.ts 의 RECIPE
premium-discount-verdict.workspace = true
# 4-쿼터 포트폴리오 (GET /nav/trials v2): 앱과 같은 규칙 (Quota C 에 대체 · discount 코스 없음)
premium-discount-nav.workspace = true
indexmap.workspace = true
url.workspace = true
hmac.workspace = true
sha2.workspace = true
k256.workspace = true
getrandom.workspace = true
regex.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
worker.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
js-sys.workspace = true

[dev-dependencies]
serde_json.workspace = true
